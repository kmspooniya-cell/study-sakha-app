
name: Study Sakha Production APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Production APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Install project dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile found"
            exit 1
          fi

      - name: Verify Expo authentication
        run: npx eas-cli@27.11.0 whoami

      - name: Build signed Production APK
        run: |
          mkdir -p artifacts
          npx eas-cli@27.11.0 build \
            --platform android \
            --profile production-apk \
            --local \
            --output ./artifacts/Study-Sakha-production.apk \
            --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-Sakha-Production-APK
          path: artifacts/Study-Sakha-production.apk
          if-no-files-found: error
          retention-days: 30
