name: Maestro Android E2E

on:
  workflow_dispatch:
    inputs:
      flow_scope:
        description: Maestro flow directory to run
        required: true
        default: all
        type: choice
        options:
          - all
          - auth
          - dashboard
          - planner
          - focus
          - notifications
          - groups
          - settings
          - regression
      apk_artifact_url:
        description: Optional Android APK download URL for emulator installation
        required: false
        type: string

jobs:
  maestro-android-e2e:
    name: Android Emulator Maestro E2E
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verify Maestro CLI
        run: maestro --version

      - name: Run Maestro flows on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_APP_ID: com.anonymous.agonpreview
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
          MAESTRO_RUN_ID: ${{ github.run_id }}
          APK_URL: ${{ inputs.apk_artifact_url }}
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_7
          script: |
            if [ -n "$APK_URL" ]; then
              curl -fsSL "$APK_URL" -o app-e2e.apk
              adb install -r app-e2e.apk
            else
              echo "No APK URL supplied; assuming pre-installed APK or configure EAS build download."
              exit 1
            fi
            FLOW_TARGET="e2e/maestro/flows"
            if [ "${{ inputs.flow_scope }}" != "all" ]; then
              FLOW_TARGET="e2e/maestro/flows/${{ inputs.flow_scope }}"
            fi
            maestro test \
              --config e2e/maestro/config.yaml \
              -p android \
              --format HTML-DETAILED \
              --test-output-dir e2e/maestro/artifacts \
              -e MAESTRO_APP_ID="$MAESTRO_APP_ID" \
              -e MAESTRO_RUN_ID="$MAESTRO_RUN_ID" \
              "$FLOW_TARGET"

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-e2e-artifacts
          path: e2e/maestro/artifacts/
          retention-days: 14
